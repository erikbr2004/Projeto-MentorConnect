{% extends 'base.html' %}

{% block content %}
<div class="p-5 mb-4 bg-light rounded-3">
    <div class="container-fluid py-5">
      <h1 class="display-5 fw-bold">Bem-vindo ao UTFPR Mentor Connect</h1>
      <p class="col-md-8 fs-4">Conecte-se com veteranos e monitores para impulsionar seus estudos. Agende mentorias, tire dúvidas e compartilhe conhecimento.</p>
      {% if not user.is_authenticated %}
      <a class="btn btn-primary btn-lg" href="{% url 'signup' %}" role="button">Começar Agora</a>
      {% endif %}
    </div>
</div>
{% endblock %}
